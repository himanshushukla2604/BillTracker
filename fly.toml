# Fly.io deployment. See DEPLOY.md for the one-time setup.
# Change `app` to a name of your own (it becomes https://<app>.fly.dev).
app = "bill-tracker-change-me"
primary_region = "bom"  # Mumbai; `fly platform regions` lists others

[build]

[env]
  # Only the first account can register; then sign-ups are closed. Register yours right after deploying.
  FT_REGISTRATION = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"  # sleeps when unused (cheaper); wakes in a few seconds on the next visit
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# The SQLite database and its daily backups live on this volume, so they survive deploys.
# Keep exactly one machine: SQLite is a single file on a single disk.
[[mounts]]
  source = "bill_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
